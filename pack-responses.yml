name: Pack response.txt from remote repo
on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout response.txt from remote repo
        uses: actions/checkout@v4
        with:
          repository: ShahinHonarvar/Turbulence-Benchmark-v2
          fetch-depth: 1
          sparse-checkout: |
            **/response.txt
          sparse-checkout-cone: false

      - name: Sanity count
        run: git ls-files '**/response.txt' | wc -l

      - name: Make per-model tarballs (zstd)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for model in */ ; do
            [ -d "$model" ] || continue
            name="${model%/}"
            find "$name" -type f -name 'response.txt' -print0 \
              | tar --null -T - -cf - \
              | zstd -19 -T0 -o "${name}_responses.tar.zst"
          done

      - name: (Optional) split >1 GiB files
        run: |
          for f in *_responses.tar.zst ; do
            [ $(stat -c%s "$f") -gt 1000000000 ] && split -b 1000m -d -a 3 "$f" "${f}."
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: responses-per-model
          path: |
            *_responses.tar.zst
            *_responses.tar.zst.*
          if-no-files-found: error